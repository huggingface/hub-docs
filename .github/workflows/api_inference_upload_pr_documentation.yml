name: Upload Inference Providers PR Documentation

on:
  workflow_run:
    workflows: ["Build Inference Providers PR Documentation"]
    types:
      - completed

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@3c8f4525206d97f65c90fbcfdf242ef8c5b2e155  # main
    with:
      package_name: inference-providers
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}