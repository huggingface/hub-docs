name: Upload SageMaker PR Documentation

on:
  workflow_run:
    workflows: ["Build SageMaker PR Documentation"]
    types:
      - completed

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@08317becb911e145c7f36d06605d53e0647bcd86  # main
    with:
      package_name: sagemaker
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}
