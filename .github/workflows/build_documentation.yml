name: Build documentation

on:
  push:
    paths:
      - "docs/hub/**"
    branches:
      - main
  # rebuild by hand, e.g. after bumping the doc-builder pin (workflow-only changes don't trigger a build)
  workflow_dispatch:

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@6175bc655f1c949e6048b9277a90bd98eb8a4e6e  # main
    with:
      commit_sha: ${{ github.sha }}
      package: hub-docs
      package_name: hub
      path_to_docs: hub-docs/docs/hub/
      additional_args: --not_python_module
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
